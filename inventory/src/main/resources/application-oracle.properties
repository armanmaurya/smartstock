# ===================================================================
# Oracle Database Profile Configuration
# Activate via: spring.profiles.active=oracle or --spring.profiles.active=oracle
# ===================================================================

# Oracle JDBC URL options (Supports Docker Compose & Local overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:INVENTORY_USER}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:inventory_pass}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate Oracle Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
