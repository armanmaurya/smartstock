spring.application.name=StockSmart-Inventory
server.port=8080

# Active Profile: change to 'oracle' to connect to Oracle DB, or pass -Dspring.profiles.active=oracle
spring.profiles.active=h2

# H2 In-Memory Database (Oracle compatibility mode for instant zero-dependency testing)
spring.datasource.url=jdbc:h2:mem:stocksmart_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.armanmaurya.inventory=INFO
